name: 'Test Report'
on:
  workflow_run:
    workflows: ['.NET']
    types:
      - completed
jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
    - uses: dorny/test-reporter@2f9230a92bfadd838bacfa65e26e2f973f08f108 # v1
      with:
        artifact: dotnet-results-6.0.x-windows-latest
        name: Test Report (Windows)
        path: ./*.trx
        reporter: dotnet-trx
    - uses: dorny/test-reporter@2f9230a92bfadd838bacfa65e26e2f973f08f108 # v1
      with:
        artifact: dotnet-results-6.0.x-macos-latest
        name: Test Report (macOS)
        path: ./*.trx
        reporter: dotnet-trx
